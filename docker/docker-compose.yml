services:
  api-gateway:
    image: observability-api-gateway:1.0
    build:
      context: ../app/api-gateway
    ports:
      - "8000:8000"
    environment:
      ORDER_SERVICE_URL: http://order-service:8001
    depends_on:
      order-service:
        condition: service_healthy
    networks:
      - observability-network
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.50
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  order-service:
    image: observability-order-service:1.0
    build:
      context: ../app/order-service
    environment:
      PAYMENT_SERVICE_URL: http://payment-service:8002
    depends_on:
      payment-service:
        condition: service_healthy
    networks:
      - observability-network
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.50
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  payment-service:
    image: observability-payment-service:1.0
    build:
      context: ../app/payment-service
    networks:
      - observability-network
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.50
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  observability-network:
    driver: bridge
