apiVersion: v1
kind: ResourceQuota
metadata:
  name: microservices-quota
  namespace: microservices
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 768Mi
    limits.cpu: "2"
    limits.memory: 1536Mi
    pods: "20"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: observability-quota
  namespace: observability
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2304Mi
    limits.cpu: "4500m"
    limits.memory: 4608Mi
    pods: "40"
